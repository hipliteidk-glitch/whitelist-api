<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 248px; margin: 0; font-family: "Segoe UI", sans-serif; background: #16161a; color: #e8e8ec; }
    .wrap { padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .ver { font-size: 9.5px; font-weight: 500; letter-spacing: 0.2px;
           color: rgba(255,255,255,0.55); background: none; border: none;
           padding: 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
    .dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .dot.warn { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .row { font-size: 12px; opacity: 0.85; margin: 6px 0; }
    button { width: 100%; margin-top: 8px; padding: 8px; border: 0; border-radius: 8px; cursor: pointer; font-size: 12px; }
    .ghost { background: rgba(255,255,255,0.08); color: #e8e8ec; }
    .kofi { background: rgba(255,105,135,.16); color: #ff8fa3; border: 1px solid rgba(255,105,135,.4) !important; font-weight: 700; }
    code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span id="dot" class="dot"></span> ZeroScript <span id="ver" class="ver"></span> <span style="font-size:9px;opacity:.6">DeepSeek</span></h1>
    <div class="row" id="state">Bridge: …</div>
    <div class="row" id="tools"></div>
    <div class="row" id="servers" style="white-space:pre-line; font-family:ui-monospace,monospace; opacity:0.75"></div>
    <button class="ghost" id="reconnect">↻ Reconnect bridge</button>
    <button class="ghost" id="restart">⟳ Restart Roblox server</button>
    <button class="ghost" id="settings">⚙ Settings</button>
    <button class="ghost" id="endpoint-toggle">🔌 Bridge endpoint</button>
    <button class="ghost" id="update">⬆ Check for updates</button>
    <div class="row" id="update-out" style="display:none; white-space:pre-wrap;
         font-size:11px; background:rgba(255,255,255,.05); padding:6px;
         border-radius:6px; margin-top:6px"></div>
    <button class="ghost" id="selftest">🧪 Run self-test &amp; copy report</button>
    <div class="row" id="selftest-out" style="display:none; white-space:pre-wrap;
         font-family:ui-monospace,monospace; font-size:10px; max-height:150px;
         overflow:auto; background:rgba(255,255,255,.05); padding:6px;
         border-radius:6px; margin-top:6px"></div>
    <div id="endpoint-panel" style="display:none; margin-top:8px; padding:8px; background:rgba(255,255,255,0.05); border-radius:8px;">
      <div class="row" style="opacity:.7; margin-top:0">Leave as the default unless your bridge runs on another machine.</div>
      <input id="ep-url" type="text" spellcheck="false" placeholder="ws://127.0.0.1:17613"
             style="width:100%; box-sizing:border-box; margin:4px 0; padding:6px; font-size:11px;
                    background:#0f0f12; color:#e8e8ec; border:1px solid rgba(255,255,255,.15); border-radius:6px;" />
      <input id="ep-token" type="password" spellcheck="false" placeholder="token (remote bridges only)"
             style="width:100%; box-sizing:border-box; margin:4px 0; padding:6px; font-size:11px;
                    background:#0f0f12; color:#e8e8ec; border:1px solid rgba(255,255,255,.15); border-radius:6px;" />
      <div class="row" id="ep-warn" style="color:#fbbf24; display:none; margin:4px 0 0"></div>
      <button class="ghost" id="ep-save" style="margin-top:6px">Save &amp; reconnect</button>
      <button class="ghost" id="ep-reset" style="margin-top:4px">Reset to local</button>
    </div>
    <button class="kofi" id="kofi">♥ Tip the developer on Ko-fi</button>
    <div class="row" style="margin-top:10px; opacity:0.6">
      Run <code>start.bat</code> and open <b>Roblox Studio</b>, then go to a supported AI.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
