<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Detector - Full AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 16px;
        }
        #container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        #video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #status-badge {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
        }
        #result-box {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }
        #result-box.safe { border-color: #4caf50; color: #4caf50; }
        #result-box.unsafe { border-color: #f44336; color: #f44336; }
        #result-box.waiting { border-color: #ffa726; color: #ffa726; }
        #confidence {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 4px;
        }
        #controls {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #2a2a2a;
            color: #fff;
            flex: 1;
            min-width: 80px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        button:active { transform: scale(0.95); }
        #btn-start { background: #4caf50; }
        #btn-start:active { background: #388e3c; }
        #btn-stop { background: #f44336; }
        #btn-stop:active { background: #c62828; }
        #btn-night { background: #3f51b5; }
        #btn-night:active { background: #283593; }
        #btn-night.on { background: #ff9800; }
        #btn-night.on:active { background: #e65100; }
        #btn-ai { background: #9c27b0; }
        #btn-ai:active { background: #6a1b9a; }
        #btn-ai.on { background: #4caf50; }
        #btn-ai.on:active { background: #388e3c; }
        #status-text {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.5;
            color: #aaa;
        }
        #stats {
            margin-top: 10px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 12px;
            color: #aaa;
        }
        #stats span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="status-badge">📷 CAMERA</div>
            <div id="result-box" class="waiting">
                <span id="result-text">⬇️ Point at road</span>
                <div id="confidence">Tap Start</div>
            </div>
        </div>
        <div id="controls">
            <button id="btn-start">▶ Start</button>
            <button id="btn-stop">⏹ Stop</button>
            <button id="btn-night">🌙 Night</button>
            <button id="btn-ai">🤖 AI</button>
        </div>
        <div id="stats">
            <span id="stat-cars">🚗 Cars: 0</span>
            <span id="stat-distance">📏 Distance: --</span>
            <span id="stat-mode">🌞 Day</span>
        </div>
        <div id="status-text">📡 No uploads — runs entirely on your device</div>
    </div>

    <script>
        (function() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const resultText = document.getElementById('result-text');
            const confidenceEl = document.getElementById('confidence');
            const resultBox = document.getElementById('result-box');
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');

            let stream = null;
            let animationId = null;
            let running = false;
            let nightMode = false;
            let aiMode = false;
            let aiModel = null;
            let aiReady = false;

            // ===== STABILITY FILTER =====
            let stableResult = 'waiting';
            let resultHistory = [];
            const HISTORY_SIZE = 5;
            const REQUIRED_CONSECUTIVE = 3;

            function getStableResult(newResult) {
                resultHistory.push(newResult);
                if (resultHistory.length > HISTORY_SIZE) resultHistory.shift();
                let counts = {};
                for (let r of resultHistory) counts[r] = (counts[r] || 0) + 1;
                let maxCount = 0, mostCommon = 'waiting';
                for (let r in counts) {
                    if (counts[r] > maxCount) { maxCount = counts[r]; mostCommon = r; }
                }
                if (maxCount >= REQUIRED_CONSECUTIVE) stableResult = mostCommon;
                return stableResult;
            }

            // ===== HEURISTIC DETECTION =====
            function detectCar(imageData) {
                const data = imageData.data;
                const w = imageData.width;
                const h = imageData.height;
                const step = 8;
                let darkPixels = 0, brightPixels = 0, redPixels = 0, bluePixels = 0, edgePixels = 0;
                const startY = Math.floor(h * 0.4);
                const endY = h;
                let sampled = 0;

                for (let y = startY; y < endY; y += step) {
                    for (let x = 0; x < w; x += step) {
                        sampled++;
                        const idx = (y * w + x) * 4;
                        const r = data[idx], g = data[idx+1], b = data[idx+2];
                        const brightness = (r + g + b) / 3;
                        if (brightness < 80) darkPixels++;
                        if (brightness > 200) brightPixels++;
                        if (r > 150 && g < 100 && b < 100) redPixels++;
                        if (b > 150 && r < 100 && g < 100) bluePixels++;
                        if (x + step < w && y + step < h) {
                            const idx2 = ((y + step) * w + (x + step)) * 4;
                            const b2 = (data[idx2] + data[idx2+1] + data[idx2+2]) / 3;
                            if (Math.abs(brightness - b2) > 60) edgePixels++;
                        }
                    }
                }

                if (sampled === 0) return { result: 'waiting', confidence: 0 };

                const darkRatio = darkPixels / sampled;
                const brightRatio = brightPixels / sampled;
                const redRatio = redPixels / sampled;
                const blueRatio = bluePixels / sampled;
                const edgeRatio = edgePixels / sampled;

                let score = 0;
                if (darkRatio > 0.08) score += 25;
                if (darkRatio > 0.15) score += 20;
                if (darkRatio > 0.25) score += 15;
                if (brightRatio > 0.05) score += 10;
                if (brightRatio > 0.12) score += 15;
                if (redRatio > 0.02) score += 20;
                if (redRatio > 0.06) score += 15;
                if (blueRatio > 0.02) score += 10;
                if (edgeRatio > 0.05) score += 10;
                if (edgeRatio > 0.12) score += 10;

                let confidence = Math.min(100, Math.round(score * 0.85));
                if (darkRatio > 0.1 && brightRatio > 0.05) confidence += 10;
                if (darkRatio < 0.02 && brightRatio < 0.02 && redRatio < 0.01 && blueRatio < 0.01) {
                    confidence = Math.max(0, confidence - 30);
                }
                if (darkRatio > 0.2) confidence += 10;
                confidence = Math.min(100, Math.max(0, confidence));

                let result = 'waiting';
                if (confidence > 72) result = 'unsafe';
                else if (confidence > 25) result = 'waiting';
                else result = 'safe';

                return { result, confidence, darkRatio, brightRatio, redRatio };
            }

            // ===== CAR COUNTING =====
            function countCarsWithComponents(imageData) {
                const data = imageData.data;
                const w = imageData.width;
                const h = imageData.height;
                const mask = new Uint8Array(w * h);
                const step = 4;

                for (let y = 0; y < h; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const idx = (y * w + x) * 4;
                        const r = data[idx], g = data[idx+1], b = data[idx+2];
                        const brightness = (r + g + b) / 3;
                        const isCarPixel = (brightness < 80) || (r > 150 && g < 100 && b < 100) || (b > 150 && r < 100 && g < 100);
                        if (isCarPixel) mask[y * w + x] = 1;
                    }
                }

                const visited = new Uint8Array(w * h);
                const components = [];
                const minComponentSize = 20;

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        if (mask[y * w + x] === 1 && visited[y * w + x] === 0) {
                            const queue = [{x, y}];
                            visited[y * w + x] = 1;
                            let size = 0;
                            let minX = x, maxX = x, minY = y, maxY = y;
                            while (queue.length > 0) {
                                const p = queue.shift();
                                size++;
                                if (p.x < minX) minX = p.x;
                                if (p.x > maxX) maxX = p.x;
                                if (p.y < minY) minY = p.y;
                                if (p.y > maxY) maxY = p.y;
                                const neighbors = [{x:p.x-1,y:p.y},{x:p.x+1,y:p.y},{x:p.x,y:p.y-1},{x:p.x,y:p.y+1}];
                                for (const n of neighbors) {
                                    if (n.x >= 0 && n.x < w && n.y >= 0 && n.y < h && mask[n.y * w + n.x] === 1 && visited[n.y * w + n.x] === 0) {
                                        visited[n.y * w + n.x] = 1;
                                        queue.push(n);
                                    }
                                }
                            }
                            if (size > minComponentSize) {
                                components.push({ bbox: {x: minX, y: minY, width: maxX - minX, height: maxY - minY} });
                            }
                        }
                    }
                }
                return components;
            }

            // ===== DISTANCE ESTIMATION =====
            function estimateDistance(bbox, videoWidth) {
                const carWidthMeters = 1.8;
                const fov = 60;
                const fovRad = fov * Math.PI / 180;
                const widthFraction = bbox.width / videoWidth;
                if (widthFraction < 0.01) return null;
                return carWidthMeters / (2 * Math.tan((fovRad * widthFraction) / 2));
            }

            // ===== HEADLIGHT DETECTION =====
            function detectHeadlights(imageData) {
                const data = imageData.data;
                const w = imageData.width;
                const h = imageData.height;
                const headlights = [];
                const step = 6;

                for (let y = 0; y < h; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const idx = (y * w + x) * 4;
                        const r = data[idx], g = data[idx+1], b = data[idx+2];
                        const brightness = (r + g + b) / 3;
                        if (brightness > 200 && r > 150 && g > 150 && b > 150) {
                            headlights.push({x, y});
                        }
                    }
                }

                const clusters = [];
                const used = new Array(headlights.length).fill(false);
                for (let i = 0; i < headlights.length; i++) {
                    if (used[i]) continue;
                    const cluster = [headlights[i]];
                    used[i] = true;
                    for (let j = i + 1; j < headlights.length; j++) {
                        if (used[j]) continue;
                        const dx = headlights[i].x - headlights[j].x;
                        const dy = headlights[i].y - headlights[j].y;
                        if (Math.sqrt(dx*dx + dy*dy) < 50) {
                            cluster.push(headlights[j]);
                            used[j] = true;
                        }
                    }
                    if (cluster.length > 5) clusters.push(cluster);
                }
                return clusters;
            }

            // ===== AI MODEL =====
            async function loadAIModel() {
                try {
                    statusText.textContent = '🤖 Loading AI model...';
                    aiModel = await cocoSsd.load();
                    aiReady = true;
                    statusText.textContent = '✅ AI model ready!';
                    setTimeout(() => {
                        if (running) statusText.textContent = '📡 Live — point at road';
                    }, 2000);
                } catch(e) {
                    console.error('AI load error:', e);
                    statusText.textContent = '❌ AI load failed: ' + e.message;
                    aiReady = false;
                }
            }

            async function detectWithAI(imageData) {
                if (!aiModel || !aiReady) return null;
                try {
                    const canvas2 = document.createElement('canvas');
                    canvas2.width = imageData.width;
                    canvas2.height = imageData.height;
                    const ctx2 = canvas2.getContext('2d');
                    ctx2.putImageData(imageData, 0, 0);
                    const predictions = await aiModel.detect(canvas2);
                    return predictions.filter(p => p.class === 'car' || p.class === 'truck' || p.class === 'bus');
                } catch(e) {
                    return null;
                }
            }

            // ===== PROCESS FRAME =====
            function processFrame() {
                if (!running) return;
                const w = video.videoWidth, h = video.videoHeight;
                if (w === 0 || h === 0) {
                    animationId = requestAnimationFrame(processFrame);
                    return;
                }
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(video, 0, 0, w, h);
                const imageData = ctx.getImageData(0, 0, w, h);

                // If AI mode is enabled and ready, use AI detection
                if (aiMode && aiReady) {
                    detectWithAI(imageData).then(predictions => {
                        if (predictions && predictions.length > 0) {
                            const car = predictions[0];
                            const bbox = car.bbox;
                            const distance = estimateDistance(
                                {x: bbox[0], y: bbox[1], width: bbox[2], height: bbox[3]},
                                w
                            );

                            document.getElementById('stat-cars').textContent = `🚗 Cars: ${predictions.length}`;
                            document.getElementById('stat-distance').textContent = distance ? `📏 ${distance.toFixed(1)}m` : '📏 --';
                            document.getElementById('stat-mode').textContent = nightMode ? '🌙 Night' : '🌞 Day';

                            const stable = getStableResult(predictions.length > 0 ? 'unsafe' : 'safe');

                            if (predictions.length > 0) {
                                resultText.textContent = `🚫 ${predictions.length} CAR${predictions.length > 1 ? 'S' : ''} — WAIT!`;
                                resultBox.className = 'unsafe';
                                statusBadge.textContent = `🔴 ${predictions.length} CAR`;
                            } else {
                                resultText.textContent = '✅ SAFE — GO!';
                                resultBox.className = 'safe';
                                statusBadge.textContent = '🟢 CLEAR';
                            }
                        } else {
                            resultText.textContent = '✅ SAFE — GO!';
                            resultBox.className = 'safe';
                            statusBadge.textContent = '🟢 CLEAR';
                            document.getElementById('stat-cars').textContent = '🚗 Cars: 0';
                            document.getElementById('stat-distance').textContent = '📏 Distance: --';
                        }
                        animationId = requestAnimationFrame(processFrame);
                    });
                    return;
                }

                // Fallback to heuristic detection
                const { result, confidence, darkRatio, brightRatio, redRatio } = detectCar(imageData);

                // Car counting
                const components = countCarsWithComponents(imageData);
                const carCount = components.length;
                document.getElementById('stat-cars').textContent = `🚗 Cars: ${carCount}`;

                // Distance estimation
                let distance = null;
                let totalDistance = 0;
                let validComponents = 0;
                for (const comp of components) {
                    const d = estimateDistance(comp.bbox, w);
                    if (d !== null && d < 100) {
                        totalDistance += d;
                        validComponents++;
                    }
                }
                if (validComponents > 0) {
                    distance = totalDistance / validComponents;
                    document.getElementById('stat-distance').textContent = `📏 ${distance.toFixed(1)}m`;
                } else {
                    document.getElementById('stat-distance').textContent = '📏 --';
                }

                // Night mode
                if (nightMode) {
                    const headlights = detectHeadlights(imageData);
                    if (headlights.length > 0) {
                        statusBadge.textContent = `💡 ${headlights.length} headlights`;
                        document.getElementById('stat-mode').textContent = '🌙 Night';
                        if (carCount > 0 || headlights.length > 1) {
                            const stableNight = getStableResult('unsafe');
                            if (stableNight === 'unsafe') {
                                resultText.textContent = `🚫 ${Math.max(carCount, headlights.length)} lights — WAIT!`;
                                resultBox.className = 'unsafe';
                                statusBadge.textContent = '💡 HEADLIGHTS';
                            }
                        }
                    }
                }

                // Update UI with stable result
                const stable = getStableResult((result === 'safe' && carCount === 0) ? 'safe' : (result === 'unsafe' || carCount > 0) ? 'unsafe' : 'waiting');

                if (stable === 'safe') {
                    resultText.textContent = '✅ SAFE — GO!';
                    resultBox.className = 'safe';
                    if (!nightMode) statusBadge.textContent = '🟢 CLEAR';
                } else if (stable === 'unsafe') {
                    resultText.textContent = `🚫 ${Math.max(carCount, 1)} CAR${carCount > 1 ? 'S' : ''} — WAIT!`;
                    resultBox.className = 'unsafe';
                    if (!nightMode) statusBadge.textContent = `🔴 ${Math.max(carCount, 1)} CAR`;
                } else {
                    resultText.textContent = '⏳ CHECKING...';
                    resultBox.className = 'waiting';
                    if (!nightMode) statusBadge.textContent = '🟡 ANALYZING';
                }

                let detail = `Conf: ${confidence}%`;
                if (darkRatio !== undefined) detail += ` | Dark: ${(darkRatio*100).toFixed(0)}%`;
                if (brightRatio !== undefined) detail += ` | Bright: ${(brightRatio*100).toFixed(0)}%`;
                if (redRatio !== undefined) detail += ` | Red: ${(redRatio*100).toFixed(0)}%`;
                detail += ` | Cars: ${carCount}`;
                confidenceEl.textContent = detail;

                animationId = requestAnimationFrame(processFrame);
            }

            // ===== CAMERA CONTROLS =====
            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    running = true;
                    statusText.textContent = '📡 Live — point at road';
                    processFrame();
                } catch (err) {
                    statusText.textContent = '❌ Camera error: ' + err.message;
                    running = false;
                }
            }

            function stopCamera() {
                running = false;
                if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
                if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
                video.srcObject = null;
                statusText.textContent = '⏹ Stopped';
                resultText.textContent = '⏸ Camera off';
                resultBox.className = 'waiting';
                statusBadge.textContent = '📷 OFF';
                confidenceEl.textContent = 'Tap Start';
            }

            document.getElementById('btn-start').addEventListener('click', () => {
                if (running) stopCamera();
                startCamera();
            });
            document.getElementById('btn-stop').addEventListener('click', stopCamera);

            document.getElementById('btn-night').addEventListener('click', function() {
                nightMode = !nightMode;
                this.textContent = nightMode ? '☀️ Day' : '🌙 Night';
                this.classList.toggle('on', nightMode);
                document.getElementById('stat-mode').textContent = nightMode ? '🌙 Night' : '🌞 Day';
            });

            document.getElementById('btn-ai').addEventListener('click', function() {
                aiMode = !aiMode;
                this.textContent = aiMode ? '🧠 AI On' : '🤖 AI';
                this.classList.toggle('on', aiMode);
                if (aiMode && !aiReady) {
                    loadAIModel();
                }
            });

            // Load AI on startup (in background)
            setTimeout(loadAIModel, 2000);

            resultText.textContent = '⬇️ Point at road';
            confidenceEl.textContent = 'Tap Start';
            statusBadge.textContent = '📷 READY';
        })();
    </script>
</body>
</html>
