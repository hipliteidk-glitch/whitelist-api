name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (manual, no submodules)
        run: |
          git clone --depth 1 --single-branch --branch main https://github.com/hipliteidk-glitch/whitelist-api.git .
          rm -rf .git
          # Now we have the code without any submodule baggage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk unzip zip
          pip install buildozer Cython

      - name: Build APK
        run: |
          cd anime_alert
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-alert-apk
          path: anime_alert/bin/*.apk
