name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (manual, no submodules)
        run: |
          git clone --depth 1 --single-branch --branch main https://github.com/hipliteidk-glitch/whitelist-api.git .
          rm -rf .git

      - name: Decode keystore
        run: |
          base64 -d AnimeAlertJava/keystore.b64 > AnimeAlertJava/release.keystore

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build release APK
        run: |
          cd AnimeAlertJava
          gradle assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-alert-release-apk
          path: AnimeAlertJava/app/build/outputs/apk/release/*.apk
