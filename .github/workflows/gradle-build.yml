name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (manual, no submodules)
        run: |
          git clone --depth 1 --single-branch --branch main https://github.com/hipliteidk-glitch/whitelist-api.git .
          rm -rf .git

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        run: |
          cd AnimeAlertJava
          gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-alert-debug-apk
          path: AnimeAlertJava/app/build/outputs/apk/debug/*.apk

      - name: Notify ntfy on success
        if: success()
        run: |
          curl -H "Title: ✅ APK Build Success" -H "Priority: default" -d "The APK with AniNotify UI is ready. Download from: https://github.com/hipliteidk-glitch/whitelist-api/actions/runs/${{ github.run_id }}" https://ntfy.sh/zeroscript_alerts
