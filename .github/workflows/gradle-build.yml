name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (manual, no submodules)
        run: |
          git clone --depth 1 --single-branch --branch main https://github.com/hipliteidk-glitch/whitelist-api.git .
          rm -rf .git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias animealert -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Anime Alert, OU=Dev, O=Anime Alert, L=City, S=State, C=US" \
            -storepass password -keypass password

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build signed APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: password
          KEY_ALIAS: animealert
          KEY_PASSWORD: password
        run: |
          cd AnimeAlertJava
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-alert-signed-apk
          path: AnimeAlertJava/app/build/outputs/apk/release/*.apk
